# Orchestration configuration for DBEX project
# See scripts/orchestration/config.py for schema documentation

# Prompt paths
prompts_dir: prompts
supervisor_prompt: supervisor.md

# State management
state_file: sync/state.json

# Doc/meta auto-commit whitelist (glob patterns)
doc_whitelist:
  - input.md
  - galph_memory.md
  - docs/fix_plan.md
  - plans/**/*.md
  - prompts/**/*.md
  - .gitignore
  - .gitmodules
  - .gitattributes

# Tracked output globs for auto-commit (e.g., regenerated fixtures)
tracked_output_globs:
  - tests/fixtures/**/*.npy
  - tests/fixtures/**/*.npz
  - tests/fixtures/**/*.json
  - tests/fixtures/**/*.pkl

# Key file paths
findings_file: docs/findings.md
input_file: input.md

# Directories
logs_dir: logs
tmp_dir: tmp

# Report extensions for auto-commit
report_extensions:
  - .png
  - .jpeg
  - .npy
  - .txt
  - .md
  - .json
  - .log
  - .py
  - .c
  - .h
  - .sh

# Tracked output extensions
tracked_output_extensions:
  - .npy
  - .npz
  - .json
  - .pkl

# =============================================================================
# Spec Bootstrap Configuration
# =============================================================================
# Use this section when bootstrapping specs from an existing implementation.
# To run in bootstrap mode, set supervisor_prompt: spec_reviewer.md
# and engineer_prompt: spec_writer.md (or use a dedicated driver script).

spec_bootstrap:
  # External templates directory — single source of truth for spec structure.
  # Shards are discovered from {templates_dir}/docs/spec-shards/spec-*.md
  templates_dir: ~/Documents/project-templates

  # Local spec directory (where specs are written)
  specs:
    dir: docs/spec-shards

  # Implementation source to extract specs from
  implementation:
    dirs:
      - src/
    entry_points: []  # Populate with main entry points, e.g., src/main.py
    exclude:
      - "**/__pycache__/**"
      - "**/tests/**"
      - "**/*.pyc"

  # Exit thresholds (all must be met to complete bootstrap)
  # Coverage: % of impl behaviors with normative specs
  # Accuracy: % of spec clauses that match impl
  # Consistency: coherence + discoverability (cross-refs, index, terminology)
  # Domain Completeness: % of domain concepts (from prior specs/arch docs) with normative specs
  scoring:
    coverage: 80
    accuracy: 85
    consistency: 90
    domain_completeness: 75

  # State tracking (simplified schema)
  state_file: sync/spec_bootstrap_state.json

  # Prompts for bootstrap mode
  prompts:
    reviewer: spec_reviewer.md
    writer: spec_writer.md
