[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dbex"
version = "0.1"
dependencies = [
    "h5py",
    "scipy",
    "matplotlib",
    "numpy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dbex*"]

[tool.pytest.ini_options]
markers = [
    "allow_metadata_sigma: Stage smoke test opt-in for metadata-backed sigma fixtures",
    "architecture: Architectural constraint enforcement tests (ARCH-*)",
]
